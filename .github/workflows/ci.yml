name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: forkan
          POSTGRES_PASSWORD: forkan
          POSTGRES_DB: forkan
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U forkan" --health-interval 5s --health-timeout 5s --health-retries 10
      # Receipt PDFs (payments e2e)
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3002:3000"]
    env:
      DATABASE_URL: postgresql://forkan:forkan@localhost:5433/forkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
